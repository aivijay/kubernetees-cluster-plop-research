---
# Write NodePort (primary — connections on 5433)
apiVersion: v1
kind: Service
metadata:
  name: postgres-cluster-rw-np
  namespace: cnpg-system
  labels:
    cnpg.io/cluster: postgres-cluster
spec:
  type: NodePort
  selector:
    cnpg.io/cluster: postgres-cluster
    role: primary
  ports:
    - name: postgresql
      port: 5432
      nodePort: 30433
---
# Read NodePort (replicas — connection on 5434)
apiVersion: v1
kind: Service
metadata:
  name: postgres-cluster-ro-np
  namespace: cnpg-system
  labels:
    cnpg.io/cluster: postgres-cluster
spec:
  type: NodePort
  selector:
    cnpg.io/cluster: postgres-cluster
    role: read-only
  ports:
    - name: postgresql
      port: 5432
      nodePort: 30434