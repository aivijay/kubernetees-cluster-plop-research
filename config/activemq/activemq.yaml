          env:
            - name: ARTEMIS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: activemq-secret
                  key: username
            - name: ARTEMIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: activemq-secret
                  key: password
          ports:
            - containerPort: 61616
              name: core
            - containerPort: 8161
              name: http
            - containerPort: 5672
              name: amqp
            - containerPort: 61613
              name: stomp
          volumeMounts:
            - name: activemq-data
              mountPath: /var/lib/artemisinstance
          command:
            - /bin/sh
            - -c
            - |
              mkdir -p /var/lib/artemisinstance && cd /var/lib/artemisinstance
              /opt/activemq-artemis/bin/artemis create . --user admin --password admin --role admin --force --allow-anonymous
              /var/lib/artemisinstance/bin/artemis run
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - curl -sf http://localhost:8161/ || exit 0
