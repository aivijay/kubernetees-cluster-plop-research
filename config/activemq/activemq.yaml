---
apiVersion: v1
kind: Service
metadata:
  name: activemq-master
  namespace: cnpg-system
spec:
  type: ClusterIP
  selector:
    app: activemq
    role: master
  ports:
    - port: 61616
      name: core
    - port: 8161
      name: http
---
apiVersion: v1
kind: Service
metadata:
  name: activemq-slave
  namespace: cnpg-system
spec:
  type: ClusterIP
  selector:
    app: activemq
    role: slave
  ports:
    - port: 61616
      name: core
    - port: 8161
      name: http
---
apiVersion: v1
kind: Service
metadata:
  name: activemq
  namespace: cnpg-system
spec:
  type: NodePort
  selector:
    app: activemq
  ports:
    - port: 61616
      nodePort: 30436
      name: core
    - port: 8161
      nodePort: 30437
      name: http
    - port: 5672
      nodePort: 30438
      name: amqp
    - port: 61613
      nodePort: 30439
      name: stomp